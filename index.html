<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd2b3" />
    <title>Kedi Kaçışı</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M14 10l12 10h12l12-10v26a18 18 0 01-36 0z' fill='%23f6a85b' stroke='%234a3530' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <section id="home" class="screen">
        <div class="home-top">
          <div class="chip" id="stars-chip"></div>
          <button class="icon-btn" id="sound-btn" aria-label="Ses"></button>
        </div>
        <div class="logo">
          <canvas id="home-scene"></canvas>
          <h1 data-t="title"></h1>
          <p class="subtitle" data-t="tapCat"></p>
        </div>
        <div class="progress-card">
          <div class="pc-row">
            <span class="pc-level" id="pc-level"></span>
            <span class="pc-next" id="pc-next"></span>
          </div>
          <div class="pc-track"><div class="pc-fill" id="pc-fill"></div><div class="pc-boss">👑</div></div>
        </div>
        <div class="home-actions">
          <button class="btn btn-primary btn-play" id="play-btn">
            <span data-t="play"></span>
            <small id="play-level"></small>
          </button>
          <div class="home-row">
            <button class="btn btn-secondary" id="daily-btn">
              <span id="daily-label"></span>
              <small id="streak-label"></small>
            </button>
            <button class="btn btn-secondary btn-gift" id="gift-btn">
              <span id="gift-label"></span>
              <small id="gift-sub"></small>
            </button>
          </div>
        </div>
      </section>

      <section id="game" class="screen hidden">
        <header class="hud">
          <button class="icon-btn" id="back-btn" aria-label="Geri"></button>
          <div class="hud-title" id="level-label"></div>
          <div class="hearts" id="hearts"></div>
        </header>
        <div class="subhud">
          <span class="badge hidden" id="kind-badge"></span>
          <span class="timer hidden" id="timer"></span>
        </div>
        <div class="tip hidden" id="tip"></div>
        <div class="banner hidden" id="banner">
          <div class="banner-title" id="banner-title"></div>
          <div class="banner-sub" id="banner-sub"></div>
        </div>
        <div id="stage"><canvas id="board"></canvas></div>
        <footer class="bar">
          <div class="progress">
            <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
            <span id="progress-label"></span>
          </div>
          <button class="btn btn-wake hidden" id="wake-btn">
            <span class="wake-icon">👁</span>
            <span data-t="wakeAll"></span>
          </button>
          <button class="btn btn-hint" id="hint-btn">
            <span class="hint-icon"></span>
            <span data-t="hint"></span>
            <b id="hint-count"></b>
          </button>
        </footer>
      </section>

      <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="card">
          <div class="card-art" id="modal-art"></div>
          <h2 id="modal-title"></h2>
          <p id="modal-text"></p>
          <p class="ad-note" id="modal-note" hidden></p>
          <div class="card-actions" id="modal-actions"></div>
        </div>
      </div>

      <div id="ad-notice" class="ad-notice hidden" role="status"></div>
      <div id="ad" class="ad hidden">
        <div class="ad-box">
          <div class="ad-title"></div>
          <div class="ad-count"></div>
          <button class="ad-close" aria-label="Kapat">✕</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
